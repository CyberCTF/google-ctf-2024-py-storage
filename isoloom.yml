# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# PyStorage (Google's 2024 security competition, by Google; a misc challenge) as an Isoloom spec:
# a key-value store in Python that keeps its data in a text file.
# The challenge folder 2024/quals/misc-py-storage of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-py-storage

networks:
  lab: { cidr: 10.60.197.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the store answers an unknown request with a hex-encoded failure
    script: checks/probe.sh
    wait: 60

message: |
  PyStorage (Google, 2024) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  The store writes one line per entry: what does Python consider a newline?
